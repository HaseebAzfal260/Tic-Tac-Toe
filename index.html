<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>   
        <div class="msg-container hide">
            <p class="msg" >Winner is</p>
            <button class="new-btn btn">
                <span>New Game</span></button>
        </div>
        <h1 class="heading">✖️ Tic-Tac-Toe ⭕</h1>
       
       
        <div class="container">

            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        <button class="reset">
            <span>Reset Game</span></button>
    </main>
    <script src="script.js"></script>
</body>

</html>
